[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "^0.10"
ansi-width = "0.1.0"
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "^0.4"
clap = { version = "^4.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "^0.29"
hkdf = "^0.13"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
once_cell = "1.21.4"
openidconnect = { version="^4.0", features = ["reqwest-blocking"] }
owo-colors = { version = "^4", features = ["supports-colors"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "^0.11"
tachyonfx = "^0.25"
url = "^2.5"
uuid = { version = "1.23.1", features = ["v4"] }
webbrowser = "1.2.1"
x25519-dalek = { version = "^2.0", features = ["getrandom"] }
